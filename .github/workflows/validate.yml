name: Validate Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Arch Source And Chroot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
      options: --privileged --tmpfs /run:rw,nosuid,nodev
    steps:
      - name: Check Out Exact Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Signed Arch Tools
        run: |
          pacman -Syu --noconfirm --needed base-devel python curl gnupg devtools shellcheck actionlint
          # nspawn needs the outer container identity and volatile runtime paths.
          systemd-machine-id-setup
          # The bootstrap image has public trust anchors but no local signing key.
          pacman-key --init
          pacman-key --populate archlinux
          install -Dm755 scripts/ci-nspawn.sh /usr/local/bin/systemd-nspawn
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Authenticate And Check Sources
        run: runuser -u builder -- bash scripts/ci-check.sh
      - name: Build And Install In Clean Chroot
        run: bash scripts/ci-build.sh
      - name: Retain Validation Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: .ci-output/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
